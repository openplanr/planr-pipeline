name: Publish pipeline package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run check:artifact-shell
      - run: npm run test:artifact:packed
      - run: npm run conformance:artifact
      - run: npm pack --dry-run
      # The release record must exist before the release does. Three versions
      # (0.37.0, 0.37.1, 0.37.2) were tagged and published to npm with no
      # CHANGELOG section at all, because this check lived only in a checklist a
      # human follows.
      #
      # Scoped to this one assertion: the full release audit reconciles four
      # repositories and needs them checked out, which this job does not have.
      - name: Refuse to publish a version the changelog does not document
        run: node scripts/assert-changelog-entry.mjs
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
